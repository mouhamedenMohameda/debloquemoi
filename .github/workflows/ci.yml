name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Clé factice : le build ne fait pas d'appel réel, mais certains
          # modules lisent l'env à l'import.
          GROQ_API_KEY: ci-dummy-key
